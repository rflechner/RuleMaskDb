name: rulemaskdb-e2e
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: rulemask_e2e
      POSTGRES_PASSWORD: RuleMask_E2e_Only!42
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d rulemask_e2e']
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - postgres-data:/var/lib/postgresql/data

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: RuleMask_E2e_Only!42
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 40
    volumes:
      - sqlserver-data:/var/opt/mssql

  runner:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    volumes:
      - ./reports:/reports

  report:
    image: nginx:1.28-alpine
    profiles: [report]
    ports:
      - '127.0.0.1:${RULEMASK_REPORT_PORT:-8088}:80'
    volumes:
      - ./reports:/usr/share/nginx/html:ro

volumes:
  postgres-data:
  sqlserver-data:
